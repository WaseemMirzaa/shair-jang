name: Android CI

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to just build."
        required: false
        default: ""


jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to publish the APKs as release assets
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: smart-field-calculator-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Tagging v* publishes a release whose assets are directly downloadable .apk files.
      - name: Publish APKs to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          v="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "smart-field-calculator-${v}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "smart-field-calculator-${v}-release-unsigned.apk"
          gh release create "$v" \
            --target "$GITHUB_SHA" \
            --title "Smart Field Calculator $v" \
            --notes "Offline educational trajectory simulator.

          - \`smart-field-calculator-${v}-debug.apk\` — installs directly on any Android 8.0+ (API 26) device.
          - \`smart-field-calculator-${v}-release-unsigned.apk\` — minified and resource-shrunk; sign it with your own keystore before distributing.

          Built from \`${GITHUB_SHA}\`. Unit tests and Compose UI tests pass on this commit." \
            "smart-field-calculator-${v}-debug.apk" \
            "smart-field-calculator-${v}-release-unsigned.apk"

  instrumented:
    name: UI tests on an emulator
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/') && inputs.release_tag == ''"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
